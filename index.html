<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TempInbox</title>
  <link rel="icon" type="image/png" href="./favicon.png">
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <header>
    <img src="./src/assets/logo.png" alt="TempInbox Logo" width="300">
    <h1>TempInbox</h1>
    <p>Recibe emails temporales de forma rápida y sencilla.</p>
  </header>

  <main>
    <section>
      <button id="createInboxBtn">Generar inbox temporal</button>
      <p id="inboxAddress">No inbox generated yet</p>
    </section>

    <section>
      <h2>Mensajes</h2>
      <div id="messagesList"></div>
    </section>

    <section>
      <h2>Detalle del mensaje</h2>
      <div id="messageDetail">Selecciona un mensaje</div>
    </section>
  </main>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
