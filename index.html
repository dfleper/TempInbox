<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TempInbox</title>
  <link rel="icon" type="image/png" href="./favicon.png">
  <link rel="stylesheet" href="./src/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playwrite+NZ+Basic:wght@300&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
</head>

<body>
  <header>
    <img src="./src/assets/logo.png" alt="TempInbox Logo" width="300">
    <br>
    <p>Recibe emails temporales de forma rápida y sencilla.</p>
    <br>
  </header>

  <main>

    <section>
      <button class="btn btn-soft btn-primary btn-sm" id="planBtn">Plan</button>&nbsp;
      <button class="btn btn-soft btn-primary btn-sm" id="emailBtn">Email</button>&nbsp;
      <input type="email" placeholder="Email Temporal" class="input input-primary input-sm w-40" id="inputMail" readonly/>
      <p id="monthLimit" class="mt-2"></p>

    </section>

  </main>

  <script type="module" src="./src/main.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</body>

</html>
